name: Build experimental fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-test-fpk.yml'
      - 'server/**'
      - 'src/**'
      - 'packaging/fnos/**'
      - 'scripts/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motrix-fnos-fpk-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout patched repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust and targets
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 12.16.1
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify complete application
        run: pnpm run verify
      - name: Install Rust cross-compiler and Zig
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-zigbuild
          python3 -m pip install --user --break-system-packages ziglang
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build x86 and ARM FPK
        run: pnpm run build:fpk:artifacts
      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          test -f packaging/fnos/dist/motrix_2.0.8_x86.fpk
          test -f packaging/fnos/dist/motrix_2.0.8_arm.fpk
          pnpm run verify:fpk
          (cd packaging/fnos/dist && sha256sum *.fpk > SHA256SUMS.txt)
      - name: Upload verified FPK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: motrix-fnos-2.0.8-experimental-fpk
          path: |
            packaging/fnos/dist/*.fpk
            packaging/fnos/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub prerelease (not stable)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v2.0.8-imaicai-test1
          cat > /tmp/fnos-test-release.md <<'NOTES'
          Motrix FnOS v2.0.8 experimental build based on RockerHX/motrix-fnos 2.0.7.
          Attempts to fix blank iframe when launched from fnOS HTTPS desktop via a same-origin Unix Socket gateway.
          WARNING: Not fnOS hardware tested. Back up all app data first.
          x86_64 NAS: motrix_2.0.8_x86.fpk
          ARM64 NAS: motrix_2.0.8_arm.fpk
          See docs/fnos-desktop-gateway.md for installation, gateway validation, and rollback.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packaging/fnos/dist/*.fpk packaging/fnos/dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes-file /tmp/fnos-test-release.md --prerelease
          else
            gh release create "$tag" packaging/fnos/dist/*.fpk packaging/fnos/dist/SHA256SUMS.txt --title 'Motrix FnOS 2.0.8 (experimental)' --notes-file /tmp/fnos-test-release.md --prerelease
          fi
