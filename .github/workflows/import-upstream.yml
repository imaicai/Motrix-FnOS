name: Import upstream Motrix FNOS sources

on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import complete upstream source history snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/RockerHX/motrix-fnos.git
          git fetch --depth=1 upstream main
          echo "Upstream commit: $(git rev-parse FETCH_HEAD)"
          git checkout FETCH_HEAD -- .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "chore: 导入 RockerHX/motrix-fnos 原版完整源码"
            git push origin HEAD:main
          fi
